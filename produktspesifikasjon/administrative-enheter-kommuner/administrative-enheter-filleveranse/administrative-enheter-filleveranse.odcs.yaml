      required: true
    - name: versjonId
      logicalType: string
      description: identifikasjon av en spesiell versjon av et geografisk objekt (instans)
    description: unik identifikasjon av et objekt
    required: true
  - name: oppdateringsdato
    logicalType: timestamp
    description: 'tidspunkt for siste endring på objektet


      Merknad:

      Oppdateringsdato kan være forskjellig fra datafangsdato ved at data som er registrert
      kan bufres en kortere eller lengre periode før disse legges inn i datasystemet
      (databasen).'
    required: true
  - name: gyldigFra
    logicalType: date
    description: Tidspunktet når objektet oppstod i den virkelige verden
  - name: gyldigTil
    logicalType: date
    description: Tidspunktet når objektet opphørte å eksistere i den virkelige verden
  - name: datafangstdato
    logicalType: timestamp
    description: 'dato når objektet siste gang ble registrert/observert/målt i terrenget


      Merknad: I mange tilfeller er denne forskjellig fra oppdateringsdato, da registrerte
      endringer kan bufres i en kortere eller lengre periode før disse legges inn
      i databasen.

      Ved førstegangsregistrering settes Datafangstdato lik førsteDatafangstdato.'
  - name: kvalitet
    logicalType: object
    properties:
    - name: målemetode
      logicalType: string
      authoritativeDefinitions:
      - url: https://register.geonorge.no/sosi-kodelister/generelle-konsepter/4.5/m%C3%A5lemetodekode
        type: businessDefinition
      customProperties:
      - property: sosiCodeList
        value: Målemetode
      - property: asDictionary
        value: 'true'
      description: metode for måling i grunnriss (x,y), og høyde (z) når metoden er
        den samme som ved måling i grunnriss
      required: true
    - name: nøyaktighet
      logicalType: integer
      description: 'punktstandardavviket i grunnriss for punkter samt tverravvik for
        linjer


        Merknad:

        Oppgitt i cm'
    description: beskrivelse av kvaliteten på stedfestingen
  - name: datauttaksdato
    logicalType: timestamp
    description: 'dato for uttak fra en database


      Merknad:

      Skiller seg fra Kopidato ved at en ikke skiller på om det er uttak fra en originaldatabase
      eller en kopidatabase.'
  - name: opphav
    logicalType: string
    description: 'referanse til opphavsmaterialet, kildematerialet, organisasjons/publiseringskilde


      Merknad:

      Kan også beskrive navn på person og årsak til oppdatering'
  - name: grense
    logicalType: object
    physicalType: geometry(LineString)
    required: true
    customProperties:
    - property: geometryType
      value: LineString
  - name: avgrensningstype
    logicalType: string
    logicalTypeOptions:
      pattern: ^(Riksgrense|Territorialgrense|AvtaltAvgrensningslinje|Kommunegrense|Fylkesgrense|Grunnkretsgrense|Delområdegrense|Stemmekretsgrense)$
    customProperties:
    - property: allowedValues
      value:
      - value: Riksgrense
        label: avgrensningen av nasjonen Norge på land mot andre nasjoner
      - value: Territorialgrense
        label: avgrensning i havet av statens suverenitetsområde, beregnet 12 nm (22
          224 m) utenfor og parallelt med grunnlinjen
      - value: AvtaltAvgrensningslinje
        label: 'avtalt avgrensningslinje til havs basert på folkerettslig bindende
          avtaler


          Merknad:

          Avtalt avgrensningslinje vil normalt gjelde alle aktuelle former for kyststatsjurisdiksjon.
          Detaljene vil framgå av den aktuelle avgrensningsavtale.


          Merknad 2:

          Benyttes også som avgrensning av kontinentalsokkel i internasjonalt farvann,
          der flere stater kan framlegge dokumentasjon om rettigheter til sokkelen,
          men der statene har kommet til enighet om en avgrensningslinje.'
      - value: Kommunegrense
        label: avgrensing av kommune
      - value: Fylkesgrense
        label: avgrensning av fylke
      - value: Grunnkretsgrense
        label: avgrensning av grunnkrets
      - value: Delområdegrense
        label: avgrensning av delområde
      - value: Stemmekretsgrense
        label: avgrensing av Stemmekrets
    description: angir type avgreisningslinje. Ulike objekter avgrenses av ulike typer
      grenser.
    required: true
