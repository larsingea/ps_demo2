schema:
- name: Kommune
  physicalName: kommune
  logicalType: object
  physicalType: table
  description: 'inndeling i administrative og politiske enheter innenfor fylket


    Merknad: Tilsvarer NUTS 5 og LAU 2 på internasjonalt statistisk nivå'
  customProperties:
  - property: sosiObjektType
    value: Kommune
  - property: inheritsFrom
    value: SOSI_Objekt_flate
  - property: associations
    value:
    - role: avgrensesAvGrense
      target: Grense
      cardinality: 0..*
  properties:
  - name: identifikasjon
    logicalType: object
    properties:
    - name: lokalId
      logicalType: string
      description: 'lokal identifikator av et objekt


        Merknad: Det er dataleverandørens ansvar å sørge for at den lokale identifikatoren
        er unik innenfor navnerommet.'
      required: true
    - name: navnerom
      logicalType: string
      description: 'navnerom som unikt identifiserer datakilden til et objekt, anbefales
        å være en http-URI


        Eksempel: http://data.geonorge.no/SentraltStedsnavnsregister/1.0


        Merknad : Verdien for navnerom vil eies av den dataprodusent som har ansvar
        for de unike identifikatorene og må være registrert i data.geonorge.no eller
        data.norge.no'
      required: true
    - name: versjonId
      logicalType: string
      description: identifikasjon av en spesiell versjon av et geografisk objekt (instans)
    description: unik identifikasjon av et objekt
    required: true
  - name: oppdateringsdato
    logicalType: timestamp
    description: 'tidspunkt for siste endring på objektet


      Merknad:

      Oppdateringsdato kan være forskjellig fra datafangsdato ved at data som er registrert
      kan bufres en kortere eller lengre periode før disse legges inn i datasystemet
      (databasen).'
    required: true
  - name: gyldigFra
    logicalType: date
    description: Tidspunktet når objektet oppstod i den virkelige verden
  - name: gyldigTil
    logicalType: date
    description: Tidspunktet når objektet opphørte å eksistere i den virkelige verden
  - name: datafangstdato
    logicalType: timestamp
    description: 'dato når objektet siste gang ble registrert/observert/målt i terrenget


      Merknad: I mange tilfeller er denne forskjellig fra oppdateringsdato, da registrerte
      endringer kan bufres i en kortere eller lengre periode før disse legges inn
      i databasen.

      Ved førstegangsregistrering settes Datafangstdato lik førsteDatafangstdato.'
  - name: datauttaksdato
    logicalType: timestamp
    description: 'dato for uttak fra en database


      Merknad:

      Skiller seg fra Kopidato ved at en ikke skiller på om det er uttak fra en originaldatabase
      eller en kopidatabase.'
  - name: opphav
    logicalType: string
    description: 'referanse til opphavsmaterialet, kildematerialet, organisasjons/publiseringskilde


      Merknad:

      Kan også beskrive navn på person og årsak til oppdatering'
  - name: område
    logicalType: object
    physicalType: geometry(MultiSurface)
    required: true
    customProperties:
    - property: geometryType
      value: MultiSurface
  - name: administrativEnhetNavn
    logicalType: array
    items:
      logicalType: object
      properties:
      - name: navn
        logicalType: string
        description: navnet på den administrative enheten i angitt språk.
        required: true
      - name: språk
        logicalType: string
        logicalTypeOptions:
          pattern: ^(English|KvenFinnish|LuleSami|NorthernSami|Swedish|Finnish|Norwegian|SouthernSami)$
        customProperties:
        - property: allowedValues
          value:
          - value: English
            label: English
          - value: KvenFinnish
            label: Kven Finnish
          - value: LuleSami
            label: Lule Sami
          - value: NorthernSami
            label: Northern Sami
          - value: Swedish
            label: Swedish
          - value: Finnish
            label: Finnish
          - value: Norwegian
            label: Norwegian
          - value: SouthernSami
            label: Southern Sami
        description: angir språk for det administrative navnet.
        required: true
      - name: rekkefølge
        logicalType: integer
        description: angir presentasjonsrekkefølge i sammenstaninger av nav på administretiv
          enhet ved presentasjon på alle sprøkformer.
    description: offisielt navn på en kommune, et fylke eller en nasjon
    required: true
  - name: kommunenummer
    logicalType: string
    authoritativeDefinitions:
    - url: https://register.geonorge.no/sosi-kodelister/inndelinger/inndelingsbase/kommunenummer
      type: businessDefinition
    customProperties:
    - property: sosiCodeList
      value: Kommunenummer
    - property: asDictionary
      value: 'true'
    description: 'nummerering av kommunen i henhold til Statistisk sentralbyrå sin
      offisielle liste


      Merknad: Det presiseres at kommune alltid skal ha 4 siffer, dvs. eventuelt med
      ledende null. Kommune benyttes for kopling mot en rekke andre registre som også
      benytter 4 siffer.'
    required: true
  - name: kommunenavn
    logicalType: string
    description: 'Offisielt navn på en kommune. Merk: Hvis kommunen har flere vedtatte
      parallellnavn, framstår disse i en sammenhengende tekststreng.'
    required: true
  - name: samiskForvaltningsområde
    logicalType: boolean
    description: angir om kommunen er en del ac samisk forvaltningaområde
- name: Grense
  physicalName: grense
  logicalType: object
  physicalType: table
  description: Generell avgrensingslinje
  customProperties:
  - property: sosiObjektType
    value: Grense
  - property: inheritsFrom
    value: SOSI_Objekt_grense
  properties:
  - name: identifikasjon
    logicalType: object
    properties:
    - name: lokalId
