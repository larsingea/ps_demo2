schema:
- name: Kommune
  physicalName: kommune
  logicalType: object
  physicalType: table
  description: Geografisk avgrenset forvaltningsenhet (kommune) i henhold til inndelingslova.
    Tilsvarer LAU-nivået i EUs statistiske inndeling.
  customProperties:
  - property: sosiObjektType
    value: Kommune
  properties:
  - name: identifikasjon
    logicalType: object
    properties:
    - name: lokalId
      logicalType: string
      description: Lokal identifikator, tildelt av dataleverandør/dataforvalter. Den
        lokale identifikatoren er unik innenfor navnerommet.
      required: true
    - name: navnerom
      logicalType: string
      description: Navnerom som unikt identifiserer datakilden til objektet.
      required: true
    - name: versjonId
      logicalType: string
      description: Identifikasjon av en spesiell versjon av et geografisk objekt (instans).
    description: Unik identifikasjon av et objekt, ivaretatt av den ansvarlige produsent/forvalter,
      som kan benyttes av eksterne applikasjoner som referanse til objektet.
    required: true
  - name: kommunenummer
    logicalType: string
    authoritativeDefinitions:
    - url: https://data.ssb.no/api/klass/v1/classifications/131
      type: businessDefinition
    customProperties:
    - property: sosiCodeList
      value: Kommunenummer
    - property: asDictionary
      value: 'true'
    description: Firesifret kommunenummer der de to første sifrene angir fylkestilhørighet.
    required: true
  - name: kommunenavn
    logicalType: string
    description: Offisielt navn på kommunen.
    required: true
  - name: samiskForvaltningsområde
    logicalType: boolean
    description: Angir om kommunen inngår i forvaltningsområdet for samisk språk etter
      sameloven.
  - name: område
    logicalType: object
    physicalType: geometry(Surface)
    required: true
    customProperties:
    - property: geometryType
      value: Surface
  - name: oppdateringsdato
    logicalType: timestamp
    description: Dato og tid for siste endring av objektet i datasettet.
    required: true
