# pygeoapi-konfigurasjon — generert fra datamodellen og metadata i Geonorge.
# Verdier merket "<REPLACE_ME>" må fylles inn før tjenesten kan startes.
server:
  bind:
    host: 0.0.0.0
    port: 5000
  cors: false
  url: ${PYGEOAPI_SERVER_URL:-http://localhost:5000}
  mimetype: application/json; charset=UTF-8
  encoding: utf-8
  gzip: false
  languages:
  - nb-NO
  pretty_print: true
  admin: ${PYGEOAPI_SERVER_ADMIN:-false}
  limits:
    default_items: 20
    max_items: 100
  map:
    url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
    attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap
      contributors</a>'
logging:
  level: ERROR
metadata:
  identification:
    title: Nasjonalt register over luftfartshindre
    description: 'Nasjonalt register over luftfartshindre (NRL) inneholder luftfartshindre
      som er samlet inn som følge av "Forskrift om rapportering, registrering og merking
      av luftfartshinder". NRL inneholder posisjon og andre egenskaper for menneskeskapte
      objekter som stikker opp fra terrenget (master, tårn, kraner, kraftledninger
      m.m.). Hindre i NRL er representert som vektorer, enten punkter, linjer eller
      flater.


      NB! Luftfartshinder under 15 meter med registreringsdato etter 3.7.2025 inngår
      ikke i de nedlastbare dataene. NRL-data er ikke komplett og må ikke benyttes
      til planlegging av flyvning.'
    keywords:
    - Luftfartshindre
    - NRL
    - Luftfartshinder
    - Nasjonalt register over luftfartshindre
    - Åpne data
    - beredskapsbase
    - Norge digitalt
    - modellbaserteVegprosjekter
    - fellesDatakatalog
    - Samferdsel
    - Hinder
    - Hindring
    - Lufthinder
    - SOSI_Fellesegenskaper
    - Fellesegenskaper
    - NrlLinje
    - NrlMast
    - NrlPunkt
    - NrlLuftspenn
    - NrlFlate
    - verifisertRapporteringsnøyaktighet
    - registreringsdato
    - historiskNrlId
    - vertikalAvstand
    - luftfartshindermerking
    - luftfartshinderlyssetting
    - materiale
    - høydereferanse
    - linjeType
    - beliggenhet
    - anleggsbredde
    - mastType
    - horisontalAvstand
    - punktType
    - luftspennType
    - flateType
    - luftfartshinderId
    - geometriId
    - datafangstmetode
    - datafangstmetodeHøyde
    keywords_type: theme
    terms_of_service: Norge digitalt begrenset
    url: https://kartkatalog.geonorge.no/metadata/28c896d0-8a0d-4209-bf31-4931033b1082
  license:
    name: Norge digitalt-lisens
    url: https://www.kartverket.no/geodataarbeid/norge-digitalt/partsinformasjon/avtaler-og-vilkar/norge-digitalt-lisens
  provider:
    name: Kartverket
    url: "<REPLACE_ME>"
  contact:
    name: Kartverket
    email: kundesenter@kartverket.no
    url: "<REPLACE_ME>"
