      -- Definition --

      what economic and social consequences follow a quick clay slide, and risk of
      loss of human lives   Note: Qualitative classification of consequences of damage
      in connection with risk of fatalities, personal injuries, financial loss, value
      reduction as well as the risk that important social functions can be affected'
