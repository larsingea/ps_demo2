      statistical probability that an avalanche  landslide will take place   Condition:
      The attribute landslideHazardLevelClass or avalancheStatisticProbability is
      mandatory. landslideHazardLevelClass is used in the case of quick clay and avalancheStatisticProbability
      in the case of steep terrain   Note:  Indicated as a yearly probability of avalanches/landslides.
