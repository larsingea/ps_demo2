    logicalType: string
    description: sted som objektet eksisterer på
    required: true
  - name: skredOmrID
    logicalType: integer
    description: 'unikt id-nummer for skredområde/kvikkleirefaresone


      -- Definition --

      unique ID number for landslide area or quick clay hazard zone'
    required: true
  - name: skredtype
    logicalType: string
    logicalTypeOptions:
      pattern: ^(Steinskred,\ uspesifisert|Steinsprang\ \(<\ 100\ m3\)|Lite\ fjellskred\
        \(100\ \-\ 10\ 000\ m3\)|Fjellskred\ \(>\ 10\ 000\ m3\)|Undervannsskred,\
        uspesifisert|Snøskred,\ uspesifisert|Vått\ snøskred|Tørt\ snøskred|Sørpeskred|Løssnøskred,\
        uspesifisert|Vått\ løssnøskred|Tørt\ løssnøskred|Flakskred,\ uspesifisert|Vått\
        flakskred|Tørt\ flakskred|Løsmasseskred,\ uspesifisert|Kvikkleireskred|Flomskred|Leirskred|Jordskred|Jordskred,\
        uspesifisert|Isnedfall,\ uspesifisert|Skavlfall|Utglidning\ av\ veg|Ikke\
        angitt|Ny,\ ikke\-godkjent\ skredtype)$
    customProperties:
    - property: allowedValues
      value:
      - value: Steinskred, uspesifisert
        label: Steinskred, ikke nærmere bestemt type
      - value: Steinsprang (< 100 m3)
        label: Steinsprang (steinblokker < 100 m3)
      - value: Lite fjellskred (100 - 10 000 m3)
        label: Lite fjellskred (steinblokker 100 - 10 000 m3)
      - value: Fjellskred (> 10 000 m3)
        label: Fjellskred (steinblokker > 10 000 m3)
      - value: Undervannsskred, uspesifisert
        label: Undervannsskred, ikke nærmere bestemt type
      - value: Snøskred, uspesifisert
        label: Snøskred, ikke nærmere bestemt type
      - value: Vått snøskred
        label: Vått snøskred
      - value: Tørt snøskred
        label: Tørt snøskred
      - value: Sørpeskred
        label: Sørpeskred
      - value: Løssnøskred, uspesifisert
        label: Løssnøskred, ikke nærmere bestemt type
      - value: Vått løssnøskred
        label: Vått løssnøskred
      - value: Tørt løssnøskred
        label: Tørt løssnøskred
      - value: Flakskred, uspesifisert
        label: Flakskred, ikke nærmere bestemt type
      - value: Vått flakskred
        label: Vått flakskred
      - value: Tørt flakskred
        label: Tørt flakskred
      - value: Løsmasseskred, uspesifisert
        label: Løsmasseskred, ikke nærmere bestemt type
      - value: Kvikkleireskred
        label: Kvikkleireskred
      - value: Flomskred
        label: Flomskred
      - value: Leirskred
        label: Leirskred
      - value: Jordskred
        label: Jordskred
      - value: Jordskred, uspesifisert
        label: 'Jordskred, ikke nærmere bestemt type


          Merknad: Fra og med 2015 benyttes ikke denne verdien for nye data.'
      - value: Isnedfall, uspesifisert
        label: Isnedfall, ikke nærmere bestemt type
      - value: Skavlfall
        label: Skavlfall
      - value: Utglidning av veg
        label: Utglidning av veg
      - value: Ikke angitt
        label: Skredtype ikke angitt
      - value: Ny, ikke-godkjent skredtype
        label: 'Ny, ikke-godkjent skredtype


          Merknad: Fra og med 2015 benyttes ikke denne verdien for nye data.'
    description: 'hvilke skredmasser som er forbundet med skredfaren eller skredhendelsen


      Merknad: Ulike typer skredmasser som bl.a. stein, snø, fjell, jord og kombinasjoner
      av disse


      -- Definition --

      what type of avalanche/landslide masses related to the avalanche/landslide hazard
      or event

      Note: Various types of avalanche/landslide masses, such as rock, snow, soil
      and combinations these'
    required: true
