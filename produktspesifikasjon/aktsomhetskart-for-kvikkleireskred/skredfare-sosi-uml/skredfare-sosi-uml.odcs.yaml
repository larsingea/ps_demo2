    required: true
  - name: skredOmrID
    logicalType: integer
    description: 'unikt id-nummer for skredområde/kvikkleirefaresone


      -- Definition --

      unique ID number for landslide area or quick clay hazard zone'
    required: true
  - name: skredOmrNavn
    logicalType: string
    description: 'stedsnavn som brukes i forbindelse med en skredhendelse


      -- Definition --

      place name which is used in connection with a landslide event'
  - name: arealKm2
    logicalType: number
    description: faresonens areal i kvadratkilometer (km2)
  - name: skredFaregradKlasse
    logicalType: string
    logicalTypeOptions:
      pattern: ^(Ingen|Lav|Middels|Høy)$
    customProperties:
    - property: allowedValues
      value:
      - value: Ingen
        label: Påvist ikkje kvikkleire/sprøbruddmateriale, eller topografiske forhold
          som tilsier at kvikkleireskred ikke kan forekomme
      - value: Lav
        label: Gunstige topografiske forhold.  Grunnundersøkelser viser at grunnforholdene
          er akseptable.  Det er lite eller ingen aktiv erosjon i vassdraget.  Det
          har vært liten skredaktivitet i området.  Ingen terrenginngrep, terrenginngrep
          har hatt gunstig innvirkning på stabiliteten (faregradscore 0-17)
      - value: Middels
        label: Mindre gunstig topografiske forhold.  Mangelfulle grunnundersøkelser,
          eller grunnundersøkelsene viser mindre gunstige grunnforhold.  Det er aktiv
          erosjon i vassdraget.  Det har vært betydelig skredaktivitet i området.  Eventuelle
          terrenginngrep har liten eller ingen stabilitetsforverrende virkning (faregradscore
          18-25)
      - value: Høy
        label: Ugunstige topografiske forhold.  Mangelfulle grunnundersøkelser eller
          grunnundersøkelsene viser ugunstige grunnforhold.  Det er betydelig aktiv
          erosjon i vassdraget.  Det har vært stor skredaktivitet i området.  Terrenginngrep
          med stabilitetsforverrende virkning (faregradscore 26-51)
    description: 'graden av sannsynlighet for at det skal gå et skred


      Merknad: Gjenspeiler graden av usikkerhet med hensyn til områdets stabilitet
      basert på topografiske forhold, geologiske/geotekniske forhold og erosjonsforhold.
      Skredfaregradklassen er for skredtypen kvikkleire basert på en evaluering av
      faregrad som fremkommer av at ulike vektede faktorer gir en faregradscore (0-51)


      -- Definition --

      the degree of probability that there will be a landslide

      Note: Reflects the degree of hazard as regards the area''s stability,, based
      upon topographic conditions, geological/geotechnical conditions and erosion
      conditions. For quick clay landslides the landslideHazardLevelClass is based
      upon a weighed hazardfactorscore (0-51)'
    required: true
  - name: skredSkadeKonsekvensScore
    logicalType: integer
    description: 'poengverdi basert på vektede faktorer for skadekonsekvensen


      Merknad: Se nærmere definisjon i kap. definisjoner og forkortelser.


      -- Definition --

      value (in points) based on weighted factors for the consequences of damage   Note:
      See more precise definition in chapter on definitions and abbreviations.'
  - name: skredRisikoKvikkleireKlasse
    logicalType: string
    logicalTypeOptions:
      pattern: ^(Risikoklasse\ 0|Risikoklasse\ 1|Risikoklasse\ 2|Risikoklasse\ 3|Risikoklasse\
        4|Risikoklasse\ 5)$
    customProperties:
    - property: allowedValues
      value:
      - value: Risikoklasse 0
        label: Områder hvor det ikke er fare for kvikkleireskred.
      - value: Risikoklasse 1
        label: 'Områder hvor det normalt ikke vil være aktuelt å foreta noen form
          for videre evaluering eller tiltak. Ved et eventuelt anleggsmessig inngrep
          vil det kreves dokumentasjon på at sikkerheten er tilfredsstillende.


          -- Definition --

          Areas where any further evaluation or action will normally not be relevant.
          For any intervention in the form of construction, documentation that safety
          is satisfactory will be required.'
      - value: Risikoklasse 2
        label: 'Som ved risikoklasse 1 vil det heller ikke her  normalt  være aktuelt
          å foreta noen form for videre evaluering eller tiltak. Ved et eventuelt
          anleggsmessig inngrep vil det kreves dokumentasjon på at sikkerheten er
          tilfredsstillende.


          -- Definition --

          As with Risk Class 1, neither will further evaluation or action normally
          be relevant here. For any intervention in the form of construction, documentation
          that safety is satisfactory will be required.'
      - value: Risikoklasse 3
        label: 'Omfatter soner med til dels tett bebyggelse.


          -- Definition --

          Includes zones that may in part be heavily built-up.'
      - value: Risikoklasse 4
        label: 'Omfatter for det meste soner med tett bebyggelse. Må gis høy prioritet
          i det videre arbeidet med sikring mot skred.


          -- Definition --

          Mainly comprising zones that are heavily built-up. Must be given high priority
          in the further work on preventive measures against landslide.'
      - value: Risikoklasse 5
        label: 'Omfatter soner med høyeste skadekonsekvens og høyeste faregrad. Må
          gis høy prioritet i det videre arbeidet med sikring mot skred.


          -- Definition --

          Comprising zones with the greatest injury consequences and highest hazard
          level. Must be given high priority in the ongoing work of landslide prevention.'
    description: 'risikoen for at et område kan bli påført skredskade, inndelt etter
      risikoklasser


      Merknad: Denne egenskapen gjengir en klassifisering av risiko for at området
      vil bli utsatt for skredskade. Klassifiseringsmetoden er basert på en evaluering
      av skadekonsekvens og faregrad. Evalueringen foretas ved at det beregnes poeng
      for hver sone i henhold til utarbeidde klassifiseringskriterier (se kapittel
      definisjoner og forkortelser)


      -- Definition --

      the risk that a landslide may inflict damage on an area, categorized according
      to risk classes   Note: This attribute cites a classification of risk that the
      area will be vulnerable to landslide damage. The classification method is based
      on a review of damage consequences and hazard levels'
  - name: skredKvalKartlegging
    logicalType: string
    logicalTypeOptions:
      pattern: ^(Ingen\ undersøkelse|Enkel\ undersøkelse|Supplerende\ undersøkelser\
        /\ stabilitet|Sikringstiltak\ utført)$
    customProperties:
    - property: allowedValues
      value:
      - value: Ingen undersøkelse
        label: 'Det er kun topografiske vurderinger som ligger til grunn for

          kvikkleirefaresonen, ingen befaring eller grunnundersøkelse. Denne kodeverdien
          må brukes dersom man skal utveksle soner som ikke er klassifisert'
      - value: Enkel undersøkelse
        label: 'Enkel undersøkelse av sonen, oversiktskartlegging


          -- Definition --

          Simple investigation of the zone, overview mapping.'
      - value: Supplerende undersøkelser / stabilitet
        label: 'Utført supplerende undersøkelser og vurdering av stabilitet


          -- Definition --

          Supplementary investigation and assessment of stability carried out'
      - value: Sikringstiltak utført
        label: Sikringstiltak er utført
    description: 'angir status og detaljeringsgrad  når det gjelder kartlegging av
      sonen


      -- Definition --

      indicates the status and degree of detail as regards the mapping of the zone'
    required: true
  - name: skredFaregradScore
    logicalType: integer
    description: 'tallverdi som er fremkommet ved at de viktigste kriteriene og faktorene
      som påvirker faregraden for kvikkleireskred er vurdert (jfr. Tabell 2 under
      kap.definisjoner og forkortelser.)


      -- Definition --

      numerical value which results from the evaluation of the influence of the most
      important criteria and factors on the degree of hazard of a quick clay slide
      (cf. Table 2 in the chapter on definitions and abbreviations.)'
  - name: skredSkadeKonsekvensKlasse
    logicalType: string
    logicalTypeOptions:
      pattern: ^(Ikke\ alvorlig|Mindre\ alvorlig|Alvorlig|Meget\ alvorlig)$
    customProperties:
    - property: allowedValues
      value:
      - value: Ikke alvorlig
        label: Ikke alvorlig
      - value: Mindre alvorlig
        label: 'Liten risiko for skade på mennesker, tap av liv, begrensede økonomiske
          og samfunnsmessige konsekvenser (0-6 poeng).


          -- Definition --

          Low risk of personal injuries, loss of life; limited economic and social
          consequences (0-6 points).'
      - value: Alvorlig
        label: 'Risiko for skade på mennesker/tap av liv eller betydelige økonomiske
          og samfunnsmessige konsekvenser (7-22 poeng).


          -- Definition --

          Risk of personal injuries/loss of life or substantial economic and social
          consequences (7-22 points).'
      - value: Meget alvorlig
        label: 'Stor risiko for skade på mennesker/tap av liv eller meget store økonomiske
          og samfunnsmessige konsekvenser (23-45 poeng).


          -- Definition --

          High risk of personal injuries/loss of life or very great economic and social
          consequences (23-45 points).'
    description: 'hvilke økonomiske og samfunnsmessige følger et kvikkleireskred får
      og fare for tap av menneskeliv


      Merknad: Kvalitativ klassifisering av skadekonsekvens i forbindelse med fare
      for liv, skade på mennesker, økonomiske tap, verdiforringelse samt fare for
      at viktige samfunnsmessige funksjoner skal stoppe opp.  For skredtypen kvikkleire
