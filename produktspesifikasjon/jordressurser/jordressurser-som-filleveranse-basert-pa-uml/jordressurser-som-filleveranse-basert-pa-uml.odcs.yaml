description:
  limitations: Åpne data. Lisens. Ugradert
  purpose: "I jordkartlegginga blir det lagt vekt på ni spesifikke egenskaper ved\
    \ jordsmonnet, slik som tekstur, lagdeling og drenering. Dette er relativt stabile\
    \ egenskaper ved jorda som lar seg bestemme ute i felt, in situ. En jordtype er\
    \ en spesifikk, unik kombinasjon av disse ni egenskapene. Hver jordtype har et\
    \ navn.\n\nI noen kartfigurer kan det være avvikende egenskaper enn dem som framkommer\
    \ fra jordkartleggingen. I tillegg til jordtypene innenfor hver kartfigur, registreres\
    \ også andre relevante egenskaper, slik som eventuell høy frekvens av fjellblotninger\
    \ og innhold av stein og blokk i øverste 50 cm. Dominerende hellingsklasse i hver\
    \ kartfigur tilordnes i etterkant av feltarbeidet.\n\nKlassene for innhold av\
    \ stein og blokk påvirker klassetildelingen i Jordressurser. \n\nHelling er tilordnet\
    \ som heltall, i prosent, og det er kartfigurenes gjennomsnittlige helling som\
    \ brukes i dette kartet. \nDet er også ander tilleggsegenskaper om kartfiguren\
    \ som påvirker klassetildelingen i Jordressurser."
