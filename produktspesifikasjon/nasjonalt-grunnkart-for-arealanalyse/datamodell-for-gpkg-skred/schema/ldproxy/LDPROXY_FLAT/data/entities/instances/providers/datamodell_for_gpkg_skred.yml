    properties:
      oid:
        sourcePath: objid
        type: INTEGER
        role: ID
      geometry:
        sourcePath: geometry
        type: GEOMETRY
        role: PRIMARY_GEOMETRY
        geometryType: POLYGON
        constraints:
          required: true
      identifikasjon_lokalId:
        sourcePath: identifikasjon_lokalid
        type: STRING
        description: 'lokal identifikator, tildelt av dataleverendør/dataforvalter.
          Den lokale identifikatoren er unik innenfor navnerommet, ingen andre objekter
          har samme identifikator.


          NOTE: Det er data leverendørens ansvar å sørge for at denne lokale identifikatoren
          er unik innenfor navnerommet.'
        constraints:
          required: true
      identifikasjon_navnerom:
        sourcePath: identifikasjon_navnerom
        type: STRING
        description: 'navnerom som unikt identifiserer datakilden til objektet, starter
          med to bokstavs kode jfr ISO 3166. Benytter understreking  ("_") dersom
          data produsenten ikke er assosiert med bare et land.


          NOTE 1 : Verdien for nanverom vil eies av den dataprodusent som har ansvar
          for de unike identifikatorene og vil registreres i "INSPIRE external  Object
          Identifier Namespaces Register"


          Eksempel: NO for Norge.'
        constraints:
          required: true
      identifikasjon_versjonId:
        sourcePath: identifikasjon_versjonid
        type: STRING
        description: 'identifikasjon av en spesiell versjon av et geografisk objekt
          (instans), maksimum lengde på 25 karakterers. Dersom spesifikasjonen av
          et geografisk objekt med en identifikasjon inkludererer livsløpssyklusinformasjon,
          benyttes denne versjonId for å skille mellom ulike versjoner av samme objekt.
          versjonId er en unik  identifikasjon av versjonen.


          NOTE Maksimum lengde er valgt for å tillate tidsregistrering i henhold til  ISO
          8601, slik som  "2007-02-12T12:12:12+05:30" som versjonId.'
      datauttaksdato:
        sourcePath: datauttaksdato
        type: DATE
        role: PRIMARY_INSTANT
        description: 'dato for uttak fra en database


          Merknad:

          Skiller seg fra Kopidato ved at en ikke skiller på om det er uttak fra en
          originaldatabase eller en kopidatabase.'
      datafangstdato:
        sourcePath: datafangstdato
        type: DATE
        description: 'dato når objektet siste gang ble registrert/observert/målt i
          terrenget


          Merknad: I mange tilfeller er denne forskjellig fra Oppdateringsdato, da
          registrerte endringer kan bufres i en kortere eller lengre periode før disse
          legges inn i databasen.

          Ved førstegangsregistrering settes Datafangstdato lik førsteDatafangstdato.'
      førsteDigitaliseringsdato:
        sourcePath: førstedigitaliseringsdato
        type: DATE
        description: 'dato når en representasjon av objektet i digital form første
          gang ble etablert


          Merknad:

          førsteDigitaliseringsdato kan skille seg fra førsteDatafangstdato ved at
          den første datafangsten skjedde analogt og gjort om til digital form senere
          i en produksjonsprosess.

          Eventuelt at innlegging i databasen skjedde på et senere tidspunkt enn registreringen
          /observasjonen / målingen av objektet.'
      oppdateringsdato:
        sourcePath: oppdateringsdato
        type: DATE
        description: 'dato for siste endring på objektetdataene


          Merknad:

          Oppdateringsdato kan være forskjellig fra Datafangsdato ved at data som
          er registrert kan bufres en kortere eller lengre periode før disse legges
          inn i datasystemet (databasen).


          -Definition-

          Date and time at which this version of the spatial object was inserted or
          changed in the spatial data set.'
      opphav:
        sourcePath: opphav
        type: STRING
        description: 'referanse til opphavsmaterialet, kildematerialet, organisasjons/publiseringskilde


