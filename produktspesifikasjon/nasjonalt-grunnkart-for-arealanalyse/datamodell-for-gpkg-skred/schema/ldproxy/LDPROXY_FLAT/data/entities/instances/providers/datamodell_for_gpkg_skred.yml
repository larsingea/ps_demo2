        description: 'graden av sannsynlighet for at det skal gå et skred


          Merknad: Gjenspeiler graden av usikkerhet med hensyn til områdets stabilitet
          basert på topografiske forhold, geologiske/geotekniske forhold og erosjonsforhold.
          Skredfaregradklassen er for skredtypen kvikkleire basert på en evaluering
          av faregrad som fremkommer av at ulike vektede faktorer gir en faregradscore
          (0-51)


          -- Definition --

          the degree of probability that there will be a landslide

          Note: Reflects the degree of hazard as regards the area''s stability,, based
          upon topographic conditions, geological/geotechnical conditions and erosion
          conditions. For quick clay landslides the landslideHazardLevelClass is based
          upon a weighed hazardfactorscore (0-51)'
        constraints:
          required: true
      skredSkadeKonsekvensScore:
        sourcePath: skredskadekonsekvensscore
        type: INTEGER
        description: 'poengverdi basert på vektede faktorer for skadekonsekvensen


          Merknad: Se nærmere definisjon i kap. definisjoner og forkortelser.


          -- Definition --

          value (in points) based on weighted factors for the consequences of damage   Note:
          See more precise definition in chapter on definitions and abbreviations.'
      skredRisikoKvikkleireKlasse:
        sourcePath: skredrisikokvikkleireklasse
        type: STRING
        description: 'risikoen for at et område kan bli påført skredskade, inndelt
          etter risikoklasser


          Merknad: Denne egenskapen gjengir en klassifisering av risiko for at området
          vil bli utsatt for skredskade. Klassifiseringsmetoden er basert på en evaluering
          av skadekonsekvens og faregrad. Evalueringen foretas ved at det beregnes
          poeng for hver sone i henhold til utarbeidde klassifiseringskriterier (se
          kapittel definisjoner og forkortelser)


          -- Definition --

          the risk that a landslide may inflict damage on an area, categorized according
          to risk classes   Note: This attribute cites a classification of risk that
          the area will be vulnerable to landslide damage. The classification method
          is based on a review of damage consequences and hazard levels'
      skredKvalKartlegging:
        sourcePath: skredkvalkartlegging
        type: STRING
        description: 'angir status og detaljeringsgrad  når det gjelder kartlegging
          av sonen


          -- Definition --

          indicates the status and degree of detail as regards the mapping of the
          zone'
        constraints:
          required: true
      skredFaregradScore:
        sourcePath: skredfaregradscore
        type: INTEGER
        description: 'tallverdi som er fremkommet ved at de viktigste kriteriene og
          faktorene som påvirker faregraden for kvikkleireskred er vurdert (jfr. Tabell
          2 under kap.definisjoner og forkortelser.)


          -- Definition --

          numerical value which results from the evaluation of the influence of the
          most important criteria and factors on the degree of hazard of a quick clay
          slide (cf. Table 2 in the chapter on definitions and abbreviations.)'
      skredSkadeKonsekvensKlasse:
        sourcePath: skredskadekonsekvensklasse
        type: STRING
        description: 'hvilke økonomiske og samfunnsmessige følger et kvikkleireskred
          får og fare for tap av menneskeliv


          Merknad: Kvalitativ klassifisering av skadekonsekvens i forbindelse med
          fare for liv, skade på mennesker, økonomiske tap, verdiforringelse samt
          fare for at viktige samfunnsmessige funksjoner skal stoppe opp.  For skredtypen
          kvikkleire er inndelingen basert på beregningen av en poengverdi basert
          på vektede faktorer (se kap. definisjoner og forkortelser.) i kombinasjon
          med skadekonsekvensen


          -- Definition --

          what economic and social consequences follow a quick clay slide, and risk
          of loss of human lives   Note: Qualitative classification of consequences
          of damage in connection with risk of fatalities, personal injuries, financial
          loss, value reduction as well as the risk that important social functions
          can be affected'
