          Ved førstegangsregistrering settes Datafangstdato lik førsteDatafangstdato.'
      førsteDigitaliseringsdato:
        sourcePath: førstedigitaliseringsdato
        type: DATE
        description: 'dato når en representasjon av objektet i digital form første
          gang ble etablert


          Merknad:

          førsteDigitaliseringsdato kan skille seg fra førsteDatafangstdato ved at
          den første datafangsten skjedde analogt og gjort om til digital form senere
          i en produksjonsprosess.

          Eventuelt at innlegging i databasen skjedde på et senere tidspunkt enn registreringen
          /observasjonen / målingen av objektet.'
      oppdateringsdato:
        sourcePath: oppdateringsdato
        type: DATE
        description: 'dato for siste endring på objektetdataene


          Merknad:

          Oppdateringsdato kan være forskjellig fra Datafangsdato ved at data som
          er registrert kan bufres en kortere eller lengre periode før disse legges
          inn i datasystemet (databasen).


          -Definition-

          Date and time at which this version of the spatial object was inserted or
          changed in the spatial data set.'
      opphav:
        sourcePath: opphav
        type: STRING
        description: 'referanse til opphavsmaterialet, kildematerialet, organisasjons/publiseringskilde


          Merknad:

          Kan også beskrive navn på person og årsak til oppdatering'
      prosjektURL:
        sourcePath: prosjekturl
        type: STRING
        description: URL-lenke til kartleggingsprosjektets informasjonsside
