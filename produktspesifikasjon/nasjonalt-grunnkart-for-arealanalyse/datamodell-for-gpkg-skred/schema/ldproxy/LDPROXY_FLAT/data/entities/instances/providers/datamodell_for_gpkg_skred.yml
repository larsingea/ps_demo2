        sourcePath: skredstatistikksannsynlighet
        type: STRING
        description: 'statistisk sannsynlighet for at det går et skred


          Betingelse: Egenskapen skredFaregradKlasse eller skredStatistikkSannsynlighet
          er påkrevet. skredFaregradKlasse benyttes ved kvikkleire og skredStatistikkSannsynlighet
          ved bratt terreng


          Merknad: Oppgis som et skred per antall år. I plan og bygningsloven skal
          man ta hensyn til 1000 årsskredet.


          -- Definition --

          statistical probability that an avalanche  landslide will take place   Condition:
          The attribute landslideHazardLevelClass or avalancheStatisticProbability
          is mandatory. landslideHazardLevelClass is used in the case of quick clay
          and avalancheStatisticProbability in the case of steep terrain   Note:  Indicated
          as a yearly probability of avalanches/landslides. In the Planning and Building
          Act consideration must be given for the yearly probability of 1/1000'
        constraints:
          required: true
